# ZK30 MFDB - static site + MCP server function
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# MCP endpoint (the function also self-registers /mcp via config.path;
# this redirect is a belt-and-suspenders alias).
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
