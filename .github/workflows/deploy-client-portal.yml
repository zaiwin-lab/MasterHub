name: Deploy Client Portal to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client-portal/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Create Netlify site or get existing
        id: site
        env:
          NETLIFY_AUTH_TOKEN: nfp_Yvzgo3nSLWaERiaRpqrFW1ptM3CWGip99239
        run: |
          RESPONSE=$(curl -s -X POST "https://api.netlify.com/api/v1/sites" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"masterhub-client-portal","account_slug":"zaiwin"}')

          echo "Create response: $RESPONSE"
          SITE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -z "$SITE_ID" ]; then
            SITE_ID=$(curl -s "https://api.netlify.com/api/v1/sites?filter=all" \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" | \
              python3 -c "import sys,json; sites=json.load(sys.stdin); match=[s for s in sites if s.get('name')=='masterhub-client-portal']; print(match[0]['id'] if match else '')" 2>/dev/null || true)
          fi

          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "Using site ID: $SITE_ID"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: nfp_Yvzgo3nSLWaERiaRpqrFW1ptM3CWGip99239
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          netlify deploy \
            --dir=client-portal \
            --prod \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID" \
            --message "Client Portal — deployed via GitHub Actions"

      - name: Print live URL
        run: echo "Live at https://masterhub-client-portal.netlify.app"
