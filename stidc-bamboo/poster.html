<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poster Kempen — Bamboo Sarawak</title>
<meta name="description" content="Poster kempen bercetak untuk Projek Buluh Komuniti dan Ladang Buluh Komersial, lengkap dengan kod QR ke borang permohonan." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#102C22" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23102C22'/%3E%3Cpath d='M13 5v22M19 5v22' stroke='%238CA84F' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M10.5 12h5M16.5 19h5M10.5 21h5' stroke='%23C6923B' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bamboo Sarawak" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="poster-toolbar">
  <div class="wrap poster-toolbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 2v20M15 2v20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M6.6 8h4.8M12.6 14h4.8M6.6 16h4.8M12.6 6h4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".75"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" data-i18n="po.title">Poster Kempen</span>
        <span class="brand-sub">STIDC · PUSAKA</span>
      </span>
    </a>

    <div class="nav-lang" role="group" aria-label="Bahasa">
      <button type="button" data-lang="ms" class="active">BM</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中</button>
      <button type="button" data-lang="ib">IB</button>
    </div>

    <div class="poster-tools">
      <div class="seg" id="segPoster">
        <button type="button" class="active" data-show="" data-i18n="po.both">Kedua-dua</button>
        <button type="button" data-show="a" data-i18n="po.onlyA">Komuniti</button>
        <button type="button" data-show="b" data-i18n="po.onlyB">Komersial</button>
      </div>
      <button class="btn btn-sm btn-ochre" id="btnPrintPoster" data-i18n="po.print">Cetak poster</button>
    </div>
  </div>
</div>

<div class="poster-hint">
  <div class="wrap" data-i18n="po.hint">
    <b>Untuk pegawai:</b> pilih bahasa dan poster, kemudian cetak pada kertas A4. Setiap poster mengandungi kod QR yang membuka borang permohonan yang betul secara terus. Cetak berwarna memberikan kesan terbaik, tetapi poster kekal jelas dalam hitam putih.
  </div>
</div>

<div class="poster-stage">
  <div id="posterMount"></div>
</div>

<div class="toast-zone" id="toastZone" aria-live="polite"></div>

<script src="app.js"></script>
<script src="poster.js"></script>
</body>
</html>
